name: ARM64 build

# Builds Skate 3 Recomp (its pinned commit, plus patches/) for linux-arm64
# with its own ReXGlue SDK fork and the Vulkan backend, two ways: natively on
# GitHub's ARM64 runner in a bare Fedora 44 (the release ArmadaOS is built
# on) with only the pinned toolchain, as the handheld does, and
# cross-compiled on x86-64 Ubuntu.
#
# No game files are involved: the game is built with placeholder recompiled
# code (scripts/placeholder-codegen.py), which checks that the program
# compiles and links but does not make a game that runs.

on:
  # Every branch: work reaches main without pull requests, once this is green.
  push:
    branches: ['**']
    paths-ignore:
      - scripts/build-sysroot.sh
      - .github/workflows/sysroot.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Skate 3 Recomp commit or branch (default the one in upstream.json)
        required: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 150
    steps:
      # No compilers, CMake or development files, as on ArmadaOS: the pinned
      # toolchain and sysroot bring them. jinja2 is only for the placeholder;
      # GTK 3 is the one the game uses at run time (ArmadaOS has it).
      - name: Install git, Python, the download tools and the desktop libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False git python3 python3-jinja2 curl tar xz
          libX11 libX11-xcb libxcb libwayland-client gtk3
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out Skate 3 Recomp and patch it
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build the game with placeholder recompiled code
        run: |
          s3="$RUNNER_TEMP/work/skate3recomp"
          scripts/placeholder-codegen.py "$s3"
          scripts/build-game.sh "$s3" "$RUNNER_TEMP/toolchain"
      - name: Build the recompiler that codegen runs on the handheld
        run: |
          s3="$RUNNER_TEMP/work/skate3recomp"
          export PATH="$RUNNER_TEMP/toolchain/bin:$PATH"
          cmake --build "$s3/out/linux-arm64" --target rexglue
          "$s3/third_party/rexglue-sdk/out/linux-arm64/rexglue" --help | head -n 20
      - name: Check that the program starts and finds its libraries
        run: |
          s3="$RUNNER_TEMP/work/skate3recomp"
          # No screen here, and no game: it only has to load and get going.
          timeout 20 "$s3/out/linux-arm64/skate3" --help 2>&1 | tee "$RUNNER_TEMP/start.log" || true
          ! grep -q "error while loading shared libraries" "$RUNNER_TEMP/start.log"
      - name: Check the start script, the settings and Add to Steam
        run: |
          bash -n config/skate3.sh && bash -n scripts/build.sh
          python3 -c 'import tomllib; tomllib.load(open("config/skate3.toml", "rb"))'
          mkdir -p "$RUNNER_TEMP/game" "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config"
          touch "$RUNNER_TEMP/game/skate3.sh"
          HOME="$RUNNER_TEMP/home" python3 scripts/add-to-steam.py "$RUNNER_TEMP/game"
          test -s "$RUNNER_TEMP/home/.local/share/Steam/userdata/1/config/shortcuts.vdf"

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install CMake, Ninja, wayland-scanner and jinja2
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build pkgconf libwayland-bin
          python3-jinja2
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out Skate 3 Recomp and patch it
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build the game with placeholder recompiled code
        run: |
          s3="$RUNNER_TEMP/work/skate3recomp"
          scripts/placeholder-codegen.py "$s3"
          scripts/build-game.sh "$s3" "$RUNNER_TEMP/toolchain"

  launcher:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust, and a virtual screen with OpenGL for the window
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
          command -v cargo || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test and build the launcher
        run: |
          cargo test --release --locked --manifest-path launcher/Cargo.toml
          scripts/package-launcher.sh out
          tar -tzvf out/Skate3Recomp-Launcher-linux-arm64.tar.gz
      - name: Open the launcher window
        run: |
          # Still open after 10 seconds (timeout ends it with 124): it started.
          status=0
          HOME="$RUNNER_TEMP/home" xvfb-run -a -s "-screen 0 860x620x24" \
            timeout 10 launcher/target/release/skate3-launcher || status=$?
          test "$status" = 124
