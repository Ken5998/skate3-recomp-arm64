name: ARM64 sysroot

# Builds the ARM64 sysroot (scripts/build-sysroot.sh: pinyon-shift-arm64's
# with GTK 3 added) and publishes it as release sysroot-VERSION, not marked
# latest. toolchain.json pins the one the build uses; pin a new one by hand.
# Runs when the script or this workflow changes, or by hand.

on:
  push:
    branches: ['**']
    paths:
      - scripts/build-sysroot.sh
      - .github/workflows/sysroot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the ARM64 sysroot
        run: scripts/build-sysroot.sh out/sysroot "$(date -u +%Y.%m.%d).$GITHUB_RUN_NUMBER"
      - uses: actions/upload-artifact@v7
        with:
          name: arm64-sysroot
          path: out/sysroot/
          retention-days: 3
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: arm64-sysroot
          path: out/sysroot
      - name: Publish the sysroot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(ls out/sysroot/skate3-arm64-sysroot-*.tar.xz)"
          name="$(basename "$archive" .tar.xz)"
          version="${name#skate3-arm64-sysroot-}"
          sha256="$(sha256sum "$archive" | cut -d' ' -f1 | tr a-f A-F)"
          cat > notes.md <<NOTES
          The ARM64 sysroot the build downloads to build Skate 3 Recomp on a handheld: Ubuntu 24.04 arm64 packages (glibc 2.39, GCC 14's libstdc++, X11, Wayland, GTK 3 and audio development files, pkgconf and wayland-scanner). It holds no game files.

          The packages and versions inside are in $name.packages.txt, and each package's licence in usr/share/doc. Their sources are on https://launchpad.net/ubuntu.

          SHA-256: \`$sha256\`
          NOTES
          gh release create "sysroot-$version" "$archive" "out/sysroot/$name.packages.txt" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "ARM64 sysroot $version" --notes-file notes.md --latest=false
          echo "Pin in toolchain.json: version $version, sha256 $sha256" >> "$GITHUB_STEP_SUMMARY"
