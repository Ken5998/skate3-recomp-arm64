[package]
name = "skate3-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Builds Skate 3 (Skate 3 Recomp) on an ARM64 Linux handheld from the player's own disc, then plays it or adds it to Steam"
publish = false

[[bin]]
name = "skate3-launcher"
path = "src/main.rs"

[dependencies]
# eframe drawing with OpenGL (lighter than wgpu, and there on every desktop)
# and rfd for the file dialog, as in the Saints Reborn ARM64 launcher.
eframe = { version = "0.34.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17.2"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
